<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HandCricketAI 3D</title><link rel="stylesheet" href="style.css"><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script></head><body>
<main id="game" aria-label="3D cricket ground"></main><section class="scoreboard"><div class="score-card"><span>YOU</span><strong id="score">0</strong></div><div class="score-card"><span>WICKET</span><strong id="wicket">0</strong></div><div class="score-card"><span>BALL</span><strong id="ballNumber">1/6</strong></div></section>
<div class="camera-status"><i></i>AI CAMERA READY</div><aside class="gesture-status"><div class="gesture-icon">⌁</div><div><b>Hand Gesture</b><span>Active</span></div></aside><div id="message">Ready for next ball</div><div id="debugPanel" style="display: none; position: fixed; bottom: 20px; right: 20px; background: rgba(0,0,0,0.8); color: #0f0; padding: 10px; border-radius: 5px; font-family: monospace; font-size: 12px; z-index: 10000; max-width: 300px;"><div id="debugLog" style="max-height: 150px; overflow-y: auto; margin-bottom: 5px;"></div></div><div id="cameraPrompt" class="camera-prompt hidden"><span>Allow camera access to let hand gestures work.</span><div class="camera-prompt-actions"><button id="allowCameraButton" type="button">Allow</button><button id="skipCameraButton" type="button" class="secondary">Discard</button></div></div><button id="bowlButton" disabled>◈ &nbsp;BOWL</button><button id="playAgainButton" type="button">PLAY AGAIN</button><div id="loading">Loading batsman...</div><div id="error" role="alert"></div><div id="testPanel" style="display: none; position: fixed; top: 20px; right: 20px; background: rgba(0,0,0,0.9); color: #0f0; padding: 15px; border-radius: 5px; font-family: monospace; font-size: 11px; z-index: 10000; border: 2px solid #0f0;"><div style="margin-bottom: 10px; font-weight: bold;">🧪 TEST GESTURES</div><button id="testGesture1" style="display: block; margin: 5px 0; padding: 5px 10px; background: #0f0; color: #000; border: none; cursor: pointer; font-weight: bold;">Test Gesture 1</button><button id="testGesture4" style="display: block; margin: 5px 0; padding: 5px 10px; background: #0f0; color: #000; border: none; cursor: pointer; font-weight: bold;">Test Gesture 4</button><button id="testGesture6" style="display: block; margin: 5px 0; padding: 5px 10px; background: #0f0; color: #000; border: none; cursor: pointer; font-weight: bold;">Test Gesture 6</button></div>
<script type="module" src="game.js"></script><script type="module" src="camera.js"></script></body></html>
